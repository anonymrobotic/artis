# ARTiS default configuration
#
# Motor number in the mechanical design -> Dynamixel ID used in software:
#   Motor 1, J0, base rotation about gripper axis      -> ID 8
#   Motor 2, J1, center finger-axis orientation        -> ID 1
#   Motor 4, J2, left finger-axis orientation          -> ID 2
#   Motor 6, J3, right finger-axis orientation         -> ID 3
#   Motor 3, J4, center four-bar mechanism             -> ID 4
#   Motor 5, J5, left four-bar mechanism               -> ID 5
#   Motor 7, J6, right four-bar mechanism              -> ID 6
#
# The preset values below are expressed by joint names, not raw IDs.
# This keeps the API readable and avoids confusing design motor numbers with Dynamixel IDs.

serial:
  dynamixel_port: /dev/ttyUSB1
  dynamixel_baudrate: 57600
  dynamixel_protocol: 1.0
  arduino_port: /dev/ttyACM0
  arduino_baudrate: 9600
  arduino_timeout_s: 1.0
motors:
  j0_base:
    id: 8
    min_tick: 0
    max_tick: 4095
    zero_tick: 1712
    default_speed: 80
  j1_center_axis:
    id: 1
    min_tick: 0
    max_tick: 4095
    zero_tick: 2052
    default_speed: 80
  j4_center_4bar:
    id: 4
    min_tick: 0
    max_tick: 4095
    zero_tick: 3630
    default_speed: 60
  j2_left_axis:
    id: 2
    min_tick: 0
    max_tick: 4095
    zero_tick: 2052
    default_speed: 80
  j5_left_4bar:
