# ARTiS current motor mapping from design figure.
serial:
  dynamixel_port: /dev/ttyUSB0
  dynamixel_baudrate: 57600
  protocol_version: 1.0
  arduino_port: /dev/ttyACM0
  arduino_baudrate: 9600

palm:
  # New firmware uses 1 = jam ON, 0 = jam OFF.
  # For the legacy teaching-button firmware, use configs/artis_legacy_teaching.yaml.
  on_command: "1"
  off_command: "0"

default_speed: 70

joints:
  J0:
    name: base_rotation_about_gripper_axis
    design_motor: Motor 1
    id: 8
    center_ticks: 1712
    min_ticks: 0
    max_ticks: 4095
    ticks_per_degree: 11.3777777778
    direction: 1
  J1:
