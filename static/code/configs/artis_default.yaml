    max_tick: 4095
    zero_tick: 3630
    default_speed: 60
  j3_right_axis:
    id: 3
    min_tick: 0
    max_tick: 4095
    zero_tick: 2052
    default_speed: 80
  j6_right_4bar:
    id: 6
    min_tick: 0
    max_tick: 4095
    zero_tick: 3630
    default_speed: 60
