# Legacy mapping used by U2D2_Arduino_teaching.py and U2D2_Arduino_teaching_button.py.
# This is kept for reproducing old experiments without changing old motor IDs.
serial:
  dynamixel_port: /dev/ttyUSB0
  dynamixel_baudrate: 57600
  protocol_version: 1.0
  arduino_port: /dev/ttyACM0
  arduino_baudrate: 9600

palm:
  # The uploaded Arduino_com_teaching_button.ino used the inverted serial convention:
  # Python sent '1' for relay ON, but firmware drove LOW and printed Relay OFF.
  # Adjust these two commands to match your actual relay wiring.
  on_command: "1"
  off_command: "0"

default_speed: 70

joints:
  J0:
    name: base_rotation_about_gripper_axis
    id: 8
    center_ticks: 1712
    min_ticks: 0
    max_ticks: 4095
    ticks_per_degree: 11.3777777778
    direction: 1
  J1:
    name: center_finger_axis_orientation_legacy
    id: 2
    center_ticks: 2052
    min_ticks: 0
    max_ticks: 4095
    ticks_per_degree: 11.3777777778
    direction: 1
  J2:
